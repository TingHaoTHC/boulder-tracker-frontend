<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boulder Tracker App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        
        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <h1 class="h2 text-primary fw-bold">🧗 Boulder Tracker</h1>
            <div id="weather-widget" class="badge bg-info text-dark p-2 fs-6">
                Loading weather...
            </div>
        </div>

        <div class="row g-4">
            
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white fw-bold">Add New Climb</div>
                    <div class="card-body">
                        <form id="add-climb-form">
                            <div class="mb-3">
                                <label class="form-label">Route Name</label>
                                <input type="text" id="name" class="form-control" placeholder="e.g., Midnight Lightning" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Grade</label>
                                <input type="text" id="grade" class="form-control" placeholder="e.g., V8" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Location</label>
                                <input type="text" id="location" class="form-control" placeholder="e.g., Yosemite" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select id="status" class="form-select">
                                    <option value="Project">Project</option>
                                    <option value="Sent">Sent</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Log Climb</button>
                        </form>
                    </div>
                </div>
            </div>

            
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">Logbook</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Name</th>
                                        <th>Grade</th>
                                        <th>Location</th>
                                        <th>Status</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="climbs-table-body">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted">Loading climbs...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://boulder-tracker-backend.onrender.com';

        // Fetch Weather from Backend (Open-Meteo Integration)
        async function loadWeather() {
            try {
                const res = await fetch(`${API_URL}/api/weather`);
                const data = await res.json();
                document.getElementById('weather-widget').innerText = 
                    `🌡️ Current Temp: ${data.temperature}°C | Wind: ${data.windspeed} km/h`;
            } catch (err) {
                document.getElementById('weather-widget').innerText = 'Weather unavailable';
            }
        }

        async function loadClimbs() {
            try {
                const res = await fetch(`${API_URL}/api/boulders`);
                const climbs = await res.json();
                const tbody = document.getElementById('climbs-table-body');
                tbody.innerHTML = '';

                if (climbs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No climbs logged yet. Add your first climb!</td></tr>`;
                    return;
                }

                climbs.forEach(climb => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="fw-bold">${climb.name}</td>
                        <td><span class="badge bg-secondary">${climb.grade}</span></td>
                        <td>${climb.location}</td>
                        <td>
                            <span class="badge ${climb.status === 'Sent' ? 'bg-success' : 'bg-warning text-dark'}">
                                ${climb.status}
                            </span>
                        </td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-success me-1" onclick="toggleStatus(${climb.id}, '${climb.name}', '${climb.grade}', '${climb.location}', '${climb.status}')">
                                ${climb.status === 'Sent' ? 'Mark Project' : 'Mark Sent'}
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteClimb(${climb.id})">Delete</button>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('add-climb-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newClimb = {
                name: document.getElementById('name').value,
                grade: document.getElementById('grade').value,
                location: document.getElementById('location').value,
                status: document.getElementById('status').value
            };

            await fetch(`${API_URL}/api/boulders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newClimb)
            });

            document.getElementById('add-climb-form').reset();
            loadClimbs();
        });

        async function toggleStatus(id, name, grade, location, currentStatus) {
            const updatedStatus = currentStatus === 'Sent' ? 'Project' : 'Sent';
            await fetch(`${API_URL}/api/boulders/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, grade, location, status: updatedStatus })
            });
            loadClimbs();
        }

        async function deleteClimb(id) {
            if (confirm('Are you sure you want to delete this climb?')) {
                await fetch(`${API_URL}/api/boulders/${id}`, { method: 'DELETE' });
                loadClimbs();
            }
        }

        loadWeather();
        loadClimbs();
    </script>
</body>
</html>
